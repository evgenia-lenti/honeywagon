# The Python calls that the code reader recognises inside a tool.

# Calls that run a command. The command is the first argument.
shell = [
  "subprocess.run",
  "subprocess.call",
  "subprocess.check_call",
  "subprocess.check_output",
  "subprocess.Popen",
  "os.system",
  "os.popen",
]
# Calls that always pass the command to a shell, with or without shell=True.
always_shell = ["os.system", "os.popen"]

# Calls that reach the network. The address is the first argument.
network = [
  "urllib.request.urlopen",
  "urllib.request.Request",
  "requests.get",
  "requests.post",
  "requests.put",
  "requests.patch",
  "requests.delete",
  "requests.head",
  "httpx.get",
  "httpx.post",
  "httpx.put",
  "httpx.patch",
  "httpx.delete",
  "httpx.head",
]

# Methods that run SQL, on any object. The statement is the first argument.
database_methods = ["execute", "executemany", "executescript"]

# Calls that open a database. The database is the first argument.
database_connect = ["sqlite3.connect"]

# Calls that read an environment variable. The name is the first argument.
environment_reads = ["os.environ.get", "os.getenv"]
# The mapping that holds the environment, read as os.environ["NAME"].
environment = "os.environ"

# Calls that turn a value into a number. What comes out cannot carry a command
# or a statement, so it does not count as input of the tool.
number_calls = ["int", "float"]

# Methods that read or write a file, on any object.
read_methods = ["read_text", "read_bytes"]
write_methods = ["write_text", "write_bytes"]

# Calls that prove a path stays inside its folder, or cut it down to a file
# name. A tool that makes one of them is not reported for a path built from
# its input. The name is the last part of the call: path.is_relative_to(...).
path_checks = ["is_relative_to", "commonpath", "basename", "secure_filename"]

# Calls that rebuild objects from bytes or text and can run code while they do.
# What is loaded is the first argument.
unsafe_loads = [
  "pickle.loads",
  "pickle.load",
  "marshal.loads",
  "marshal.load",
  "dill.loads",
  "dill.load",
  "jsonpickle.decode",
  "yaml.load",
  "yaml.unsafe_load",
  "yaml.full_load",
]
# The call that is safe when it is given one of these loaders.
yaml_load = "yaml.load"
safe_yaml_loaders = ["SafeLoader", "CSafeLoader", "BaseLoader", "CBaseLoader"]

# Functions and methods that make an HTTP request or build an HTTP client, on
# any object. With verify=False they accept a server that proves nothing.
http_calls = [
  "get",
  "post",
  "put",
  "patch",
  "delete",
  "head",
  "request",
  "send",
  "stream",
  "Client",
  "AsyncClient",
  "Session",
]
# Calls that build a TLS context that checks nothing.
unverified_contexts = ["ssl._create_unverified_context"]

# Decorators that mark a function as a tool, and the call that configures an agent.
sdk_tool_decorator = "claude_agent_sdk.tool"
agent_options = "claude_agent_sdk.ClaudeAgentOptions"

# Arguments of an MCP tool function that are not input from the model.
ignored_parameters = ["self", "cls", "ctx", "context"]
