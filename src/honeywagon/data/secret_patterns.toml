# Patterns that mark a key or token. The first pattern that matches wins.
# Used both to find secrets and to redact them from every output.

[[pattern]]
name = "Anthropic API key"
regex = '\bsk-ant-[A-Za-z0-9_-]{16,}'

[[pattern]]
name = "OpenAI API key"
regex = '\bsk-(?:proj-)?[A-Za-z0-9_-]{32,}'

[[pattern]]
name = "GitHub token"
regex = '\b(?:gh[pousr]_|github_pat_)[A-Za-z0-9_-]{20,}'

[[pattern]]
name = "Slack token"
regex = '\bxox[abprs]-[A-Za-z0-9-]{16,}'

[[pattern]]
name = "AWS access key"
regex = '\bAKIA[0-9A-Z]{16}\b'

[[pattern]]
name = "Google API key"
regex = '\bAIza[0-9A-Za-z_-]{35}\b'

[[pattern]]
name = "Stripe live key"
regex = '\b[sr]k_live_[0-9A-Za-z]{16,}'

[[pattern]]
name = "Private key"
regex = '-----BEGIN [A-Z ]*PRIVATE KEY-----'
