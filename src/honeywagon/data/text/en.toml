# Every text that the creator of a project reads, in English.
# A second language is a second file with the same keys.

[checks.secret-in-file]
title = "A key or token is written in a file"
consequence = "Anyone who can read this file can use the key as if they were you. That includes everyone with access to the repository and its history."

[checks.perm-broad-bash]
title = "The skill allows any shell command"
consequence = "Whoever uses the skill lets Claude run any command on their computer without being asked first."

[checks.hook-remote-code]
title = "A hook downloads a script and runs it"
consequence = "The hook runs by itself, with no question asked. Whoever controls that address can run any command on the computer of everyone who uses this project."

