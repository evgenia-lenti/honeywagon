# Every text that the creator of a project reads, in English.
# A second language is a second file with the same keys.

[checks.secret-in-file]
title = "A key or token is written in a file"
consequence = "Anyone who can read this file can use the key as if they were you. That includes everyone with access to the repository and its history."

[checks.perm-broad-bash]
title = "The skill allows any shell command"
consequence = "Whoever uses the skill lets Claude run any command on their computer without being asked first."

[checks.hook-remote-code]
title = "A hook downloads a script and runs it"
consequence = "The hook runs by itself, with no question asked. Whoever controls that address can run any command on the computer of everyone who uses this project."

[checks.perm-bypass-permissions]
title = "The agent never asks before it acts"
consequence = "The agent runs every tool it has, including the ones that change or delete things, without a person approving anything."

[checks.perm-bypass-in-settings]
title = "A settings file asks for no permission prompts"
consequence = "Claude Code 2.1.257 and newer ignore this setting inside a project, so there it does nothing. Older versions obey it and run every tool without asking. Either way the project should not ask for it."

[checks.inject-shell]
title = "Input of a tool goes into a shell command"
consequence = "Whoever controls the input, including text that the model read somewhere, can add their own commands and run them on the computer where the tool runs."

[checks.inject-sql]
title = "Input of a tool is pasted into the text of a SQL statement"
consequence = "Whoever controls the input, including text that the model read somewhere, can change what the statement does: read other rows and tables, or change and delete data."

[checks.tool-free-form-sql]
title = "A tool runs any SQL it is given"
consequence = "The model can read, change or delete anything in the database, not only what this tool was meant for. A single misleading message is enough."

[checks.mcp-fetch-any-url]
title = "A tool calls any address it is given"
consequence = "The tool can be pointed at internal systems that are not meant to be reached from outside, and what it gets back is passed to the model."

[checks.ref-missing-file]
title = "The skill points to a file that does not exist"
consequence = "The step that needs this file fails, or Claude makes something up to replace it."

[checks.test-real-database]
title = "A test opens the real database"
consequence = "Running the tests reads or changes real data, and the tests pass or fail depending on what the database holds that day."

[checks.dep-security]
title = "A dependency has a known security problem"
consequence = "Published security problems of this version ({count}): {advisories}. In brackets is the version that fixes each one, as the OSV database lists it. Anyone can look these problems up and try them against your project."

[checks.mcp-unpinned-server]
title = "An MCP server is downloaded without a fixed version"
consequence = "Each start may run a different version. If a new version is broken or malicious, it runs on your computer with no warning."

[checks.port-absolute-path]
title = "A path points into one person's home folder"
consequence = "This works only on that person's computer. For everyone else the step fails."

[checks.agent-no-turn-limit]
title = "The agent has no limit on how many turns it runs"
consequence = "If the agent gets stuck in a loop, it keeps running and keeps costing money until someone stops it."

