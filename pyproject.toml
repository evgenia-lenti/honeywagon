[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "honeywagon"
version = "0.0.1"
description = "On-demand audit tool for agentic AI artifacts built with Claude."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evgenia Lenti" }]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
audit = "honeywagon.cli:main"

[tool.setuptools.package-data]
honeywagon = ["data/*.toml", "data/text/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# evaluate.py sits at the repository root and the tests import it.
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
# Code samples in the design documents are illustrations, and the code in the
# fixtures is wrong on purpose.
extend-exclude = ["docs", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests", "evaluate.py"]
