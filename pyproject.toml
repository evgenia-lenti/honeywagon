[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "honeywagon"
version = "0.0.1"
description = "On-demand audit tool for agentic AI artifacts built with Claude."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evgenia Lenti" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
# Code samples inside the design documents are illustrations, not project code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
